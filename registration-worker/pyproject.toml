[project]
name = "brainbuilder-registration-worker"
version = "0.2.0"
description = "Allen CCF registration and probe-track backend for BrainBuilder"
requires-python = ">=3.11,<3.12"
dependencies = [
  "brainglobe-atlasapi>=2.0,<3",
  "deepslice>=1.2.8,<1.3",
  "numpy>=2.0,<3",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "scikit-image>=0.24,<0.27",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "simpleitk>=2.4,<3",
  "tifffile>=2024.7,<2027",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
